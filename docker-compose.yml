# Despliegue completo: microservicio del censo + web.
# Sólo el servicio "web" publica puerto; el microservicio queda en la red interna.
#
#   cp config.example.json config.json && cp public/logo.svg logo.svg
#   mkdir -p data && cp /ruta/al/censo.txt data/
#   TOKEN=$(openssl rand -hex 32) docker compose up -d --build
#
# La carpeta ./data debe poder escribirla el UID 1000 (el microservicio crea la
# base de datos y borra el CSV tras importarlo).

services:
  censo:
    image: harbor.videoatencion.com/library/censo-electoral:latest
    build: https://github.com/videoatencion/consulta-censo-electoral.git
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?Defina la variable de entorno TOKEN}
      TIMEZONE: Europe/Madrid
      # Campos indexados: sustitúyalos por la opción mínima que proponga
      #   docker run --rm -v "$PWD/data:/data:ro" harbor.videoatencion.com/library/censo-electoral:latest analizar
      # Parte del documento indexada (por defecto: últimos 5 caracteres con la
      # letra). La web lee este formato del propio microservicio (GET /formato).
      DOCUMENT_CHARS: "5"
      # FIRST_CHARS: "true"             # primeros N caracteres en vez de los últimos
      # FIRST_CHARS_ADD_LETTER: "true"  # con FIRST_CHARS: primeros N + la letra
      DAY: "true"
      YEAR: "true"
      FN: "true"
      SN1: "true"
      SN2: "true"
      POST_CODE: "true"
    volumes:
      - ./data:/data

  web:
    build: .
    restart: unless-stopped
    environment:
      BACKEND_URL: http://censo:8080
      BACKEND_TOKEN: ${TOKEN:?Defina la variable de entorno TOKEN}
      RATE_LIMIT: 30r/m
      RATE_BURST: "20"
      # Obligatorio detrás de un balanceador o ingress (su rango):
      # REAL_IP_FROM: 10.0.0.0/8
    volumes:
      # Configuración y logotipo del ente, sin recompilar la imagen:
      - ./config.json:/usr/share/nginx/html/config.json:ro
      - ./logo.svg:/usr/share/nginx/html/logo.svg:ro
    ports:
      - "8080:8080"
    depends_on:
      - censo
